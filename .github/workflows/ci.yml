# CI/CD Pipeline for CCBA Agent Platform

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install packages
        run: |
          uv pip install -e "packages/ccba-harness" --system
          uv pip install --no-deps -e "packages/ccba-ai[dev]" --system
          uv pip install --no-deps -e "packages/ccba-legal-intel[dev]" --system
          uv pip install --no-deps -e "packages/ccba-notebooklm[dev]" --system
          uv pip install --no-deps -e "packages/ccba-ooxml[dev]" --system
          uv pip install --no-deps -e "packages/ccba-pdf-prep[dev]" --system
          uv pip install --no-deps -e "packages/mdconverter[dev]" --system

      - name: Run CCBA Harness CI Gates
        run: python scripts/run_harness_evals.py --all

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyMarkdown
        run: pip install pymarkdownlnt

      - name: Lint Markdown files
        run: python -m pymarkdown scan README.md PLATFORM.md
        continue-on-error: true
