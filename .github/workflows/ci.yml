# CI/CD Pipeline for CCBA Agent Platform

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install packages
        run: |
          uv pip install -e "packages/ccba-ai[dev]" --system
          uv pip install -e "packages/mdconverter[dev]" --system

      - name: Run Ruff linter
        run: ruff check packages/

      - name: Run Ruff formatter check
        run: ruff format --check packages/

      - name: Run MyPy
        run: mypy packages/mdconverter/src/ --ignore-missing-imports

      - name: Run mdconverter tests
        run: pytest packages/mdconverter/tests/ -v --cov=packages/mdconverter/src/mdconverter --cov-report=xml

      - name: Run ccba-ai tests
        run: pytest packages/ccba-ai/tests/ -v

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyMarkdown
        run: pip install pymarkdownlnt

      - name: Lint Markdown files
        run: python -m pymarkdown scan README.md PLATFORM.md
        continue-on-error: true
