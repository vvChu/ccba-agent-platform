# CI/CD Pipeline for CCBA Agent Platform

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Cache uv wheels and git checkouts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'packages/**/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install packages and dev tools
        run: |
          uv pip install --system \
            ruff mypy pytest pytest-cov pytest-timeout pytest-xdist pyyaml requests pydantic pydantic-settings psutil \
            -e "packages/ccba-harness" \
            -e "packages/ccba-diagram[dev]" \
            -e "packages/ccba-pdf-prep[dev]" \
            -e "packages/ccba-ai[dev]" \
            -e "packages/ccba-qc-core" \
            -e "packages/ccba-legal-intel[dev]" \
            -e "packages/ccba-notebooklm[dev]" \
            -e "packages/ccba-ooxml[dev]" \
            -e "packages/ccba-maskara[dev]" \
            -e "packages/mdconverter[dev]"

      - name: Run CCBA Harness CI Gates
        env:
          PYTHONPATH: .
          CCBA_AI_MOCK: "1"
        run: python scripts/eval/run_harness_evals.py --all --ci-matrix


      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  deterministic-parity:
    name: Deterministic Parity & Schema Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Cache uv wheels and git checkouts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('pyproject.toml', 'packages/**/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-3.12-

      - name: Install packages and dev tools
        run: |
          uv pip install --system \
            ruff mypy pytest pytest-cov pytest-timeout pyyaml requests pydantic pydantic-settings psutil \
            -e "packages/ccba-harness" \
            -e "packages/ccba-diagram[dev]" \
            -e "packages/ccba-pdf-prep[dev]" \
            -e "packages/ccba-ai[dev]" \
            -e "packages/ccba-qc-core" \
            -e "packages/ccba-legal-intel[dev]" \
            -e "packages/ccba-notebooklm[dev]" \
            -e "packages/ccba-ooxml[dev]" \
            -e "packages/ccba-maskara[dev]" \
            -e "packages/mdconverter[dev]"

      - name: Run Deterministic Hard Completion Lock (ADR-0058)
        env:
          PYTHONPATH: .
          CCBA_AI_MOCK: "1"
        run: python -m ccba_harness verify-patch --preset ci

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyMarkdown
        run: pip install pymarkdownlnt

      - name: Lint Markdown files
        run: python -m pymarkdown scan README.md PLATFORM.md
        continue-on-error: true
