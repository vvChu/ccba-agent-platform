# CI/CD Pipeline for CCBA Agent Platform

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install packages and dev tools
        run: |
          uv pip install ruff mypy pytest pytest-cov pyyaml requests pydantic pydantic-settings psutil --system
          uv pip install -e "packages/ccba-harness" --system
          uv pip install -e "packages/ccba-pdf-prep[dev]" --system
          uv pip install -e "packages/ccba-ai[dev]" --system
          uv pip install -e "packages/ccba-qc-core" --system
          uv pip install -e "packages/ccba-legal-intel[dev]" --system
          uv pip install -e "packages/ccba-notebooklm[dev]" --system
          uv pip install -e "packages/ccba-ooxml[dev]" --system
          uv pip install -e "packages/ccba-maskara[dev]" --system
          uv pip install -e "packages/mdconverter[dev]" --system

      - name: Run CCBA Harness CI Gates
        env:
          PYTHONPATH: .
          CCBA_AI_MOCK: "1"
        run: python scripts/eval/run_harness_evals.py --all

      - name: Deterministic Hard Completion Lock (ADR-0058)
        env:
          PYTHONPATH: .
          CCBA_AI_MOCK: "1"
        run: python -m ccba_harness verify-patch --preset ci


      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyMarkdown
        run: pip install pymarkdownlnt

      - name: Lint Markdown files
        run: python -m pymarkdown scan README.md PLATFORM.md
        continue-on-error: true
