# Nightly CI Pipeline for Heavy & Slow Integration Tests
name: Nightly Slow Tests

on:
  schedule:
    # Trigger at 02:00 UTC (09:00 AM ICT) every night
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

permissions:
  contents: read

jobs:
  nightly-slow-tests:
    name: Run Slow Integration & Stress Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Cache uv wheels and git checkouts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-3.11-${{ hashFiles('pyproject.toml', 'packages/**/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-3.11-

      - name: Install packages and dev tools
        run: |
          uv pip install --system \
            ruff mypy pytest pytest-timeout pytest-cov pytest-xdist pyyaml requests pydantic pydantic-settings psutil \
            -e "packages/ccba-harness" \
            -e "packages/ccba-diagram[dev]" \
            -e "packages/ccba-pdf-prep[dev]" \
            -e "packages/ccba-ai[dev]" \
            -e "packages/ccba-qc-core" \
            -e "packages/ccba-legal-intel[dev]" \
            -e "packages/ccba-notebooklm[dev]" \
            -e "packages/ccba-ooxml[dev]" \
            -e "packages/ccba-maskara[dev]" \
            -e "packages/mdconverter[dev]"

      - name: Run Slow & Stress Tests Across All Packages (Dynamic Discovery)
        env:
          PYTHONPATH: .
          CCBA_AI_MOCK: "1"
        run: python scripts/eval/run_isolated_tests.py --all --stress


      - name: Run Test Speed Guard Compliance Audit
        run: python scripts/hooks/test_speed_guard.py
