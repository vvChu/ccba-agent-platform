name: Documentation Check

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '**/*.py'
      - '**/*.yaml'
      - '**/*.toml'
      - '.github/workflows/validate-docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '**/*.py'
      - '**/*.yaml'
      - '**/*.toml'
      - '.github/workflows/validate-docs.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml pydantic
          # Install ccba-ai editable for type check validation references
          pip install -e packages/ccba-harness
          pip install --no-deps -e packages/ccba-ai

      - name: Run Spoke Leakage Guard (ADR 0045)
        run: |
          python scripts/governance/check_spoke_leakage.py

      - name: Run Skills & Workflows Quality Validator (ADR 0040)
        run: |
          python scripts/validate_skills.py

      - name: Run Documentation Accuracy Validator
        run: |
          python scripts/validate_docs.py . --src scripts,packages --changed
