[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccba-agent-platform"
version = "1.0.0"
description = "CCBA Agent Services Platform — Central Hub for AI Agent skills, workflows, knowledge, and internal tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "IBST BIM Team", email = "bim@ibst.vn" }
]
keywords = ["agent", "platform", "skills", "workflows", "ccba", "bim"]

# Root workspace has minimal dependencies
dependencies = []

[project.urls]
Homepage = "https://github.com/vvChu/ccba-agent-platform"
Repository = "https://github.com/vvChu/ccba-agent-platform"

[project.scripts]
ccba-decrypt-registry = "scripts.spoke.decrypt_spoke_registry:decrypt_registry"
ccba-gen-keys = "scripts.spoke.generate_registry_keys:generate_keys"
ccba-find-skills = "scripts.spoke.find_skills:main"
ccba-seo-audit = "scripts.validation.seo_audit:main"
ccba-eval = "scripts.eval.run_harness_evals:main"
ccba-test = "scripts.eval.run_isolated_tests:main"
ccba-compile-knowledge = "scripts.spoke.compile_knowledge:main"
ccba-legal-sync = "scripts.legal.legal_sync:main"
ccba-audit-pr = "scripts.validation.audit_pr_comments:main"


# === Workspace Config (for uv) ===
[tool.uv.workspace]
members = ["packages/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccba_agent_platform", "scripts"]


# === Shared Tooling ===
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["packages/*/src", "packages/*/tests"]
exclude = [
    ".agents",
    ".md",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.md",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in argument defaults (Typer pattern)
    "E402",  # module level import not at top of file (pytestmark / sys.path pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false
exclude = ["*.md"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = ["packages/mdconverter/src", "packages/ccba-ai/src", "packages/ccba-harness/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["llama_index.*", "google.generativeai.*", "tenacity.*", "yt_dlp.*", "ccba_ai.*", "ccba_pdf_prep.*", "fitz.*", "ccba_ooxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mdconverter.providers.gemini"]
disallow_untyped_decorators = false


[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = [
    "packages/ccba-ai/src",
    "packages/ccba-harness/src",
    "packages/ccba-legal-intel/src",
    "packages/ccba-maskara/src",
    "packages/ccba-notebooklm/src",
    "packages/ccba-ooxml/src",
    "packages/ccba-pdf-prep/src",
    "packages/mdconverter/src",
]
testpaths = ["packages", "tests", "scripts/tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --strict-markers -m 'not stress and not slow'"
timeout = 30

markers = [
    "unit: Fast isolated unit tests (under 1s)",
    "integration: Integration tests (under 5s)",
    "slow: Tests taking more than 5s",
    "stress: High load stress and concurrency tests",
    "adversarial: Adversarial edge-case and attack-vector tests",
    "asyncio: Mark async test functions",
]

