[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccba-agent-platform"
version = "1.0.0"
description = "CCBA Agent Services Platform — Central Hub for AI Agent skills, workflows, knowledge, and internal tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "IBST BIM Team", email = "bim@ibst.vn" }
]
keywords = ["agent", "platform", "skills", "workflows", "ccba", "bim"]

# Root workspace has minimal dependencies
dependencies = []

[project.urls]
Homepage = "https://github.com/vvChu/ccba-agent-platform"
Repository = "https://github.com/vvChu/ccba-agent-platform"

# === Workspace Config (for uv) ===
[tool.uv.workspace]
members = ["packages/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccba_agent_platform"]


# === Shared Tooling ===
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in argument defaults (Typer pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["llama_index.*", "google.generativeai.*", "tenacity.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mdconverter.providers.gemini"]
disallow_untyped_decorators = false
