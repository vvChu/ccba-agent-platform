[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ccba-qc-core"
version = "0.1.0"
description = "CCBA AI Quality Control Core Engine — Discovery, Quad-View Alignment, Semantic Clash, and Multi-Discipline Audits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ccba-ai",
    "ccba-pdf-prep",
    "ccba-legal-intel",
    "pymupdf>=1.23.0",
    "Pillow>=10.0.0",
    "pandas>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
ccba-qc = "ccba_qc_core.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ccba_qc_core*"]

[tool.uv.sources]
ccba-ai = { workspace = true }
ccba-pdf-prep = { workspace = true }
ccba-legal-intel = { workspace = true }
