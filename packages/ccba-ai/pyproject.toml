[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccba-ai"
version = "1.0.0"
description = "CCBA AI Gateway Client — Kết nối 22 models (local GPU + cloud) qua 1 endpoint"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "openai>=1.0.0,<3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccba_ai"]
