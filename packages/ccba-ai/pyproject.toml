[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccba-ai"
version = "1.2.0"
description = "CCBA AI Gateway Client — Kết nối đa mô hình (local GPU + cloud) qua 1 endpoint"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "openai>=2.31.0,<4.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=0.1.0,<3",
    "cryptography>=41.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
harness = ["ccba-harness"]

[project.scripts]
ccba-mcp = "ccba_ai.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ccba_ai"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "../ccba-harness/src",
]
asyncio_mode = "auto"
markers = [
    "fast: Fast isolated unit tests (under 2s, pure logic and mock I/O)",
    "unit: Fast isolated unit tests (under 1s)",
    "integration: Integration tests (under 5s)",
    "slow: Tests taking more than 5s",
    "stress: High load stress and concurrency tests",
    "adversarial: Adversarial edge-case and attack-vector tests",
    "asyncio: Mark async test functions",
]

[tool.uv.sources]
ccba-harness = { workspace = true }
