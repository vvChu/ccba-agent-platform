[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdconvert-cli"
version = "2.0.0"
description = "Document to Markdown converter with Vietnamese legal document support"
readme = "../../README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "IBST BIM Team", email = "bim@ibst.vn" }
]
keywords = ["markdown", "converter", "document", "pdf", "docx", "vietnamese", "legal"]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0,<3.0.0",
    "httpx>=0.27.0",
    "watchdog>=4.0.0",
    "tenacity>=8.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.11.0",
    "ruff>=0.15.10",
]
llm = [
    "google-generativeai>=0.8.0,<1.0.0",
    "llama-index>=0.11.0,<1.0.0",
]

[project.scripts]
mdconvert = "mdconverter.cli:app"

[project.entry-points."mdconverter.plugins"]
vn_legal = "mdconverter.plugins.vn_legal"

[tool.hatch.build.targets.wheel]
packages = ["src/mdconverter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src/mdconverter --cov-report=term-missing"
