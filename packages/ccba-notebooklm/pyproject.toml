[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccba-notebooklm"
version = "0.1.0"
description = "CCBA NotebookLM API integration package"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ccba_notebooklm"]
