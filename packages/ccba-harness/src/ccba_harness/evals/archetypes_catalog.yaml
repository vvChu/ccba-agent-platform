# archetypes_catalog.yaml - Declarative Domain Archetype Registry
# Single Source of Truth for Domain Evaluation Mappings & Keyword Routing (ADR-0023, ADR-0057, ADR-0058)

archetypes:
  # 1. Specialized Subdomains (Separated from parent domains to prevent collision)
  - name: grilling
    keywords:
      - grill
      - stresstest
      - stress-test
    dataset_file: eval_grilling.json
    scorer_factory: get_grilling_scorers

  - name: adr
