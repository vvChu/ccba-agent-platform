authorities:
  VN-HN:
    - current_name: "Sở Xây dựng TP. Hà Nội"
      status: "active"
      is_single_window: true
      valid_from: "2026-08-10"
      governance_notes: "Cơ quan đầu mối Một Cửa thẩm định TMB 1/500, TKCS, GPXD và nghiệm thu đa ngành"
      functions:
        - "planning_and_architecture"
        - "construction_management"
        - "building_permits"
        - "transport_infrastructure"
        - "quality_inspection"
      building_grade_routing:
        major_projects: ["cap_1", "cap_2", "deep_underground", "major_urban_axes"]
      predecessors:
        - name: "Sở Quy hoạch - Kiến trúc TP. Hà Nội"
          aliases:
            - "Sở Quy hoạch - Kiến trúc"
            - "Sở Quy hoạch - Kiến trúc TP. Hà Nội"
            - "Sở Quy hoạch - Kiến trúc Hà Nội"
