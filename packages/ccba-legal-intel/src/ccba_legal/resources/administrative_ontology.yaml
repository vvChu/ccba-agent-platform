            - "Sở Quy hoạch Kiến trúc"
            - "SQHKT"
          valid_to: "2026-08-09"
          dissolved_date: "2026-08-10"
          legal_basis: "Nghị quyết Kỳ họp thứ 6 HĐND TP. Hà Nội khóa XVII (10/08/2026)"
          transferred_functions: ["planning_and_architecture"]
          warning: "Sở Quy hoạch - Kiến trúc đã sáp nhập/giải thể từ 10/08/2026. Toàn bộ chức năng quy hoạch - kiến trúc đã chuyển giao trọn vẹn về Sở Xây dựng TP. Hà Nội."

        - name: "Sở Giao thông vận tải TP. Hà Nội"
