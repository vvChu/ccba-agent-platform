            - "Sở Giao thông Vận tải"
            - "SGTVT"
          valid_to: "2025-02-28"
          dissolved_date: "2025-03-01"
          legal_basis: "Đề án sắp xếp cơ quan chuyên môn theo Luật Thủ đô 2024 & NQ HĐND TP Hà Nội"
          transferred_functions: ["transport_infrastructure"]
          warning: "Sở Giao thông vận tải đã hợp nhất vào Sở Xây dựng từ 03/2025 đối với lĩnh vực hạ tầng giao thông và thỏa thuận đấu nối."

    - current_name: "Sở Tài chính TP. Hà Nội"
      status: "active"
      predecessors:
