[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccba-legal-intel"
version = "0.1.0"
description = "CCBA Legal Intelligence and OKF Knowledge Bundle Pipeline"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "websocket-client",
    "python-docx",
    "pyyaml",
    "ccba-harness",
    "ccba-ai",
    "pytest-timeout",
    "beautifulsoup4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ccba_legal*"]

[tool.uv.sources]
ccba-harness = { workspace = true }
ccba-ai = { workspace = true }

[tool.pytest.ini_options]
timeout = 5


