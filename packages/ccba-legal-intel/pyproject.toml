[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccba-legal-intel"
version = "0.1.0"
description = "CCBA Legal Intelligence and OKF Knowledge Bundle Pipeline"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "websocket-client",
    "python-docx",
    "pyyaml",
    "ccba-harness",
    "ccba-ai",
    "pytest-timeout",
    "beautifulsoup4",
    "mammoth",
    "rank-bm25",
]

[project.scripts]
ccba-legal = "ccba_legal.cli:main"

[project.optional-dependencies]
cloud = [
    "ccba-notebooklm",
    "google-api-python-client",
    "google-auth",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ccba_legal"]

[tool.uv.sources]
ccba-harness = { workspace = true }
ccba-ai = { workspace = true }
ccba-notebooklm = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "../mdconverter/src",
    "../ccba-ai/src",
    "../ccba-harness/src",
    "../ccba-notebooklm/src",
]
timeout = 30
markers = [
    "slow: Marks tests as slow-running",
    "adversarial: Marks tests as adversarial/stress tests",
]



