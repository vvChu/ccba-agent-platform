[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccba-ooxml"
version = "1.2.0"
description = "CCBA OOXML Utilities — Shared library for packaging, validating, and DOM manipulating docx/pptx documents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "lxml>=5.0.0",
    "defusedxml>=0.7.1",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
]

[project.scripts]
ccba-ooxml = "ccba_ooxml.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccba_ooxml"]

[tool.hatch.build.targets.wheel.force-include]
"src/ccba_ooxml/templates" = "ccba_ooxml/templates"
