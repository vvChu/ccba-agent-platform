[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ccba-pdf-prep"
version = "0.2.0"
description = "CCBA AI PDF Preprocessor — Segmenting, Chunking and Vision optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0.0",
    "pymupdf>=1.23.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "Pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
ccba-pdf = "ccba_pdf_prep.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ccba_pdf_prep*"]

