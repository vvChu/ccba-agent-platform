  wayfinder: "ccba-wayfinder"
  implement: "ccba-implement"
  implement-spec: "ccba-implement"
  llm-wiki: "ccba-knowledge-loop"
  diagnosing-bugs: "ccba-diagnosing-bugs"
  tdd: "ccba-tdd"
  code-review: "ccba-code-review"
  create-pr: "ccba-create-pr"

