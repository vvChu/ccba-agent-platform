    branch: "master"
    enabled: true
    description: "Microsoft 365 & SharePoint PnP Declarative List/View/Form JSON Formatting Samples (routed to ccba-sharepoint-iac)"

# Bảng luật phân loại bản quyền 6 bậc (ADR-0061 Parameter Externalization)
license_rules:
  dual_copyleft_regex:
    - '\b(?:mit|apache(?:-2\.0)?|bsd|isc)\s*(?:or|/|\|)\s*(?:a|l)?gpl'
    - '\b(?:a|l)?gpl(?:[-_ ]?v?[23](?:\.0)?)?\s*(?:or|/|\|)\s*(?:mit|apache|bsd|isc)'
    - '\bdual[- ]licens[^\n]{0,100}\b(?:a|l)?gpl\b'
  dual_permissive_regex:
    - '\b(?:mit|apache(?:-2\.0)?|bsd|isc)\s*(?:or|/|\|)\s*(?:mit|apache(?:-2\.0)?|bsd|isc)\b'
  copyleft_regex:
    - 'gnu general public'
    - 'mozilla public license'
    - '\b(?:a|l)?gpl(?:\b|[-_ ]?v?[23])'
    - '\bmpl(?:\b|[-_ ]?2)'
  permissive_tokens:
    - 'mit license'
    - 'permission is hereby granted'
    - 'isc license'
    - 'permission to use, copy, modify, and/or distribute'
    - 'apache license'
    - 'zero-clause bsd'
    - '0bsd'
    - 'bsd'
    - 'unlicense'
    - 'this is free and unencumbered software'
  proprietary_tokens:
    - 'all rights reserved'
    - 'proprietary'

report_hygiene:
  stale_block_tokens:
    - 'simulated approval'
    - 'Port via ccba-kit'
    - '(ADR-0040)'
    - '[IGNORE (Đã tồn tại)]'
  restricted_license_markers:
    - 'Bản quyền đóng'
    - 'Rủi ro sao chép'
    - 'Custom license'
    - 'Không phát hiện'

