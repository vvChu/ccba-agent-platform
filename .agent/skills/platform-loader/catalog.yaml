workflows:
  - name: prepare-seminar
    command: /prepare-seminar
    description: "Chuẩn bị nội dung cho buổi seminar/thảo luận nội bộ CCBA"
    triggers:
      - chuẩn bị seminar
      - buổi thảo luận
      - prepare seminar
    workflow_path: .agent/workflows/prepare-seminar.md

  - name: update-legal-registry
    command: /update-legal-registry
    description: "Cập nhật registry VBPL và kiểm tra tác động lên danh mục hồ sơ hoàn thành"
    triggers:
      - cập nhật VBPL
      - legal update
      - update registry
      - văn bản mới
    workflow_path: .agent/workflows/update-legal-registry.md

  - name: session-retrospective
    command: /session-retrospective
    description: "Tổng hợp kiến thức cuối phiên làm việc"
    triggers:
      - retrospective
      - cuối phiên
      - tổng kết
      - session learnings
    workflow_path: .agent/workflows/session-retrospective.md

  - name: create-pr
    command: /create-pr
    description: "Push code và tạo Pull Request tự động"
    triggers:
      - create PR
      - pull request
    workflow_path: .agent/workflows/create-pr.md

  - name: release-feature
    command: /release-feature
    description: "Merge PR, cleanup branch và cập nhật walkthrough"
    triggers:
      - release
      - merge PR
    workflow_path: .agent/workflows/release-feature.md

  - name: new-feature
    command: /new-feature
    description: "Tạo feature branch mới với cleanup tự động"
    triggers:
      - new feature
      - feature mới
    workflow_path: .agent/workflows/new-feature.md

  - name: discard-feature
    command: /discard-feature
    description: "Hủy bỏ branch hiện tại, xóa cả local và remote"
    triggers:
      - discard
      - hủy branch
    workflow_path: .agent/workflows/discard-feature.md

  - name: convert-markdown
    command: /convert-markdown
    description: "Chuyển đổi tài liệu sang Markdown bằng mdconverter"
    triggers:
      - convert
      - mdconverter
      - chuyển đổi tài liệu
    workflow_path: .agent/workflows/convert-markdown.md

rules:
  - name: ccba_identity
    description: "Brand, voice, phong cách giao tiếp CCBA"
    when: "Mọi output mang danh CCBA"
    rule_path: rules/ccba_identity.md

  - name: quality_standards
    description: "Tiêu chuẩn chất lượng QC"
    when: "Tạo output QC/testing"
    rule_path: rules/quality_standards.md

  - name: naming_conventions
    description: "Quy ước đặt tên file và folder"
    when: "Tạo file/folder mới"
    rule_path: rules/naming_conventions.md

  - name: compliance
    description: "Tuân thủ pháp luật xây dựng Việt Nam"
    when: "Output liên quan pháp luật/VBPL"
    rule_path: rules/compliance.md

knowledge:
  - name: session_learnings
    description: "Patterns, anti-patterns, solutions tích lũy qua các phiên"
    knowledge_path: knowledge/session_learnings.md
