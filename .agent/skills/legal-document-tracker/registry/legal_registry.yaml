standards:
  - id: QCVN-06-2022
    title: "QCVN 06:2022/BXD Quy chuẩn kỹ thuật quốc gia về An toàn cháy cho nhà và công trình"
    short_name: "QCVN 06:2022"
    issued_date: "2022-11-30"
    effective_date: "2023-01-16"
    status: current
    topics: [fire_safety, design_requirements, architecture, mep]
    amendments:
      - "Sửa đổi 1:2023 QCVN 06:2022/BXD (Ban hành kèm Thông tư 09/2023/TT-BXD)"
    source_url: "https://moc.gov.vn/vn/pages/ChiTietVanBan.aspx?vID=3701"
    notes: >
      Quy chuẩn then chốt về an toàn cháy. Các yêu cầu về:
      1. Bậc chịu lửa, giới hạn chịu lửa kết cấu (REI)
      2. Đường thoát nạn, lối thoát hiểm, buồng thang N1, N2, N3
      3. Giải pháp cấp nước chữa cháy, chống tụ khói
      4. Phân chia khoang cháy

