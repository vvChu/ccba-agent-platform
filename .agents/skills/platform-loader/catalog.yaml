    description: "Chuyển đổi tài liệu sang Markdown bằng mdconverter"
    triggers: [convert, mdconverter, chuyển đổi tài liệu, pdf to markdown]
    workflow_path: .agents/workflows/ccba-convert-markdown.md

  - name: brainstorm
    bundle: _core
    command: /ccba-brainstorm
    description: "Khởi động phiên thảo luận ý tưởng và chuẩn bị tài liệu đầu vào tại input_documents/"
    triggers: [brainstorm, ý tưởng, nạp tài liệu, thảo luận, đầu vào]
    workflow_path: .agents/workflows/ccba-brainstorm.md

  # === _software ===
  - name: new-feature
    bundle: _software
    command: /ccba-new-feature
    description: "Tạo feature branch mới với cleanup tự động"
    triggers: [new feature, feature mới, tạo branch]
    workflow_path: .agents/workflows/ccba-new-feature.md

  - name: create-pr
    bundle: _software
    command: /ccba-create-pr
    description: "Push code và tạo Pull Request tự động"
    triggers: [create PR, pull request, tạo PR]
    workflow_path: .agents/workflows/ccba-create-pr.md

  - name: release-feature
    bundle: _software
