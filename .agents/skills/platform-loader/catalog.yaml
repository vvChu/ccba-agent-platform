workflows:
  # === _core ===
  - name: init-ccba-spoke
    bundle: _core
    command: /ccba-init-spoke
    description: "Khởi tạo dự án (Spoke) tuân thủ kiến trúc CCBA Agent Platform"
    triggers: [init spoke, setup project, khởi tạo dự án]
    workflow_path: .agents/workflows/ccba-init-spoke.md

  - name: update-ccba-spoke
    bundle: _core
