rules:
- name: ccba_identity
  description: Brand, voice, phong cách giao tiếp CCBA
  when: Mọi output mang danh CCBA
  rule_path: .agents/rules/ccba_identity.md
- name: naming_conventions
  description: Quy ước đặt tên file, folder và phân loại thư mục tri thức
  when: Tạo hoặc sắp xếp file/folder mới
  rule_path: .agents/rules/naming_conventions.md
- name: compliance
  description: Tuân thủ pháp luật xây dựng Việt Nam
  when: Output liên quan đến pháp luật/VBPL hoặc các văn bản pháp lý
  rule_path: .agents/rules/legal_compliance.md
- name: release_gate
  description: Quy trình kiểm soát PR Release và Copilot Audit
  when: Khi chuẩn bị merge PR hoặc hoàn tất bàn giao
  rule_path: .agents/rules/release_gate.md
- name: debugging
  description: Quy tắc đọc logs và chẩn đoán lỗi runtime
  when: Khi người dùng báo lỗi runtime hoặc ứng dụng crash
  rule_path: .agents/rules/debugging.md
knowledge:
- name: session_learnings
  description: Patterns, anti-patterns, solutions tích lũy qua các phiên
  knowledge_path: knowledge/session_learnings.md
- name: bigbim_method_kb
  description: BIGBIM Method Knowledge Base v1.0 — 36 articles, 266 chunks, 3-layer
    architecture
