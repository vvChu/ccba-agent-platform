    description: "Sync bundle phù hợp từ Hub về dự án Spoke hiện tại"
    triggers: [update spoke, đồng bộ hub, lấy lệnh mới, cập nhật dự án]
    workflow_path: .agents/workflows/ccba-update-spoke.md

  - name: session-retrospective
