hub_path: .
hub_repo: https://github.com/vvChu/ccba-agent-platform
notebook_ids:
  _core: nb-mock-3
  _software: nb-mock-software
  _qc: nb-mock-qc
  _consulting: nb-mock-consulting
  _bim: nb-mock-bim
bundles:
  Phần mềm:
  - _core
  - _software
  Thẩm tra thiết kế:
  - _core
  - _qc
  - _consulting
  Thiết kế:
  - _core
  - _qc
  - _consulting
  Kiểm định:
  - _core
  - _qc
  - _consulting
  BIM:
  - _core
  - _bim
  Tác vụ Admin:
  - _core
  - _consulting
  Pháp điển:
  - _core
