purpose_and_scope:
  vi: >
    Phiếu này được thiết kế để nhóm chuyên gia IBST trực tiếp đồng hành, phỏng vấn và hỗ trợ Nhà máy
    thu thập các Yêu cầu sử dụng của Chủ đầu tư (User Requirements) và các thông số công nghệ đầu vào.
    Dựa trên các yêu cầu này, nhóm chuyên gia IBST sẽ chịu trách nhiệm phân tích quy chuẩn (QCVN 06:2022/BXD,
    QCVN 10:2025/BCA), tính toán kỹ thuật và đề xuất các phương án tối ưu trong Hồ sơ Đề cương (SOW) và Báo giá Tư vấn.
  en: >
    This brief is designed for IBST - CCBA experts to walk through and conduct on-site interviews with the Client,
    gathering User Requirements and manufacturing baselines. Based on these inputs, IBST - CCBA will assume full
    responsibility for statutory code analysis, engineering calculations, and proposing optimal technical schemes.

sections:
  - section_id: "I"
    section_title_vi: "RANH GIỚI KHU ĐẤT & HỒ SƠ THAM CHIẾU HIỆN HỮU"
    section_title_en: "PLOT BOUNDARY & EXISTING REFERENCE DOCUMENTS"
    items:
      - ref_code: "1.1"
        title_vi: "Vị trí & Ranh giới Khu đất Mở rộng"
        title_en: "Expansion Plot Location & Boundary"
        request_details:
          - "Xác định công trình mở rộng nằm trong khuôn viên Lô J1-J2 hiện hữu hay thuê bổ sung lô đất liền kề."
          - "Cung cấp bản vẽ sơ họa vị trí dự kiến xây dựng nhà máy mới trên tổng mặt bằng."
        consultant_recommendation: >
          Đề xuất của Tư vấn: Nếu phía Nhà máy chưa có bản vẽ tách lô chính thức, chuyên gia IBST
          sẽ mang thiết bị Flycam và máy đo toàn đạc để định vị tọa độ mốc ranh giới ngay trong buổi khảo sát.
        deliverable_formats:
          - checked: true
            label: "File CAD (.dwg) / PDF"
          - checked: true
            label: "Khảo sát thực địa đo đạc"
          - checked: false
            label: "Mô hình BIM (.rvt/.ifc)"
        client_feedback:
          - checked: false
            text: "Thuộc khuôn viên Lô J1-J2 hiện hữu"
          - checked: false
            text: "Thuê thêm lô đất mới ngoài hàng rào"
          - checked: false
            text: "Vị trí dự kiến: Phía sau xưởng 2"

      - ref_code: "1.2"
        title_vi: "Hồ sơ Quy hoạch KCN Thăng Long"
        title_en: "Industrial Park Planning Documents"
        request_details:
          - "Bản sao Bản vẽ Quy hoạch tổng mặt bằng 1/500 của Lô J1-J2 đã được BQL KCN phê duyệt."
          - "Các thỏa thuận đấu nối hạ tầng ngoài hàng rào sẵn có (giao thông, thoát nước, cấp điện)."
        consultant_recommendation: >
          Đề xuất của Tư vấn: Chuyên gia IBST sẽ đối soát trực tiếp các chỉ tiêu quy hoạch (mật độ xây dựng tối đa,
          chỉ giới xây dựng lùi) để tối đa hóa diện tích sàn xưởng được phép xây dựng theo QCVN 01:2021/BXD.
        deliverable_formats:
          - checked: true
            label: "File bản vẽ 1/500 (.dwg/.pdf)"
          - checked: false
            label: "Bản sao văn bản thỏa thuận"
        client_feedback:
          - checked: false
            text: "Có sẵn bản vẽ 1/500 phê duyệt cũ"
          - checked: false
            text: "Cần hỗ trợ liên hệ BQL KCN"

      - ref_code: "1.3"
        title_vi: "Hồ sơ Bản vẽ Trạm bơm & Bể nước PCCC Hiện hữu"
        title_en: "As-Built Drawings of Existing Fire Pump Station & Water Tank"
        request_details:
          - "Bản vẽ mặt bằng, mặt cắt trạm bơm PCCC và kích thước hình học bể nước ngầm hiện hữu."
          - "Catalog thông số kỹ thuật của các máy bơm chữa cháy đang hoạt động."
        consultant_recommendation: >
          Đề xuất của Tư vấn: Chuyên gia IBST sẽ đo đạc cao độ rốn hút (Sump pit), tấm chống xoáy và tính toán
          lại dung tích hữu ích theo QCVN 02:2020/BCA nhằm tận dụng tối đa trạm bơm hiện có, tránh phát sinh chi phí xây mới.
        deliverable_formats:
          - checked: true
            label: "File bản vẽ hoàn công (.dwg/.pdf)"
          - checked: true
            label: "Khảo sát đo đạc thực tế bể"
        client_feedback:
          - checked: false
            text: "Có sẵn bản vẽ trạm bơm cũ (cho mượn sao chép)"
          - checked: true
            text: "Nhất trí để chuyên gia IBST đo đạc lại cao độ bể thực tế"

  - section_id: "II"
    section_title_vi: "NHU CẦU KHÔNG GIAN & QUY MÔ DÂY CHUYỀN SẢN XUẤT"
    section_title_en: "SPATIAL PROGRAM & MANUFACTURING PRODUCTION LINE"
    items:
      - ref_code: "2.1"
        title_vi: "Quy mô Diện tích & Tầng cao Kỳ vọng"
        title_en: "Target GFA & Number of Storeys"
        request_details:
          - "Dự kiến nhà máy mở rộng xây mấy tầng (1 tầng trệt có sàn lửng, 2 tầng, hay 3 tầng)?"
          - "Tổng diện tích sàn xây dựng mong muốn khoảng bao nhiêu m2?"
          - "Diện tích xưởng sản xuất chính cần khoảng bao nhiêu m2?"
        consultant_recommendation: >
          Đề xuất của Tư vấn: Đối với nhà máy sản xuất thiết bị điện tử có phòng sạch, giải pháp 2 tầng
          kết cấu thép chịu lửa kết hợp sàn Decking bê tông sẽ tối ưu hóa mật độ xây dựng và thuận tiện bố trí tầng kỹ thuật MEPF.
        deliverable_formats:
          - checked: true
            label: "Bảng nhu cầu diện tích (URS)"
          - checked: false
            label: "Sơ đồ dây chuyền khối"
        client_feedback:
          - checked: false
            text: "Dự kiến: 02 tầng, tổng diện tích sàn khoảng 12.000 m2"
          - checked: false
            text: "Diện tích xưởng sản xuất sạch: khoảng 6.000 m2"

      - ref_code: "2.2"
        title_vi: "Phân khu Chức năng Cần bố trí"
        title_en: "Functional Areas to Accommodate"
        request_details:
          - "Khu vực sản xuất chính, phòng sạch (Cleanroom), kho nguyên vật liệu / kho thành phẩm."
          - "Văn phòng điều hành, phòng họp, phòng thay đồ, trạm biến áp, phòng nén khí."
        consultant_recommendation: >
          Đề xuất của Tư vấn: Chuyên gia IBST sẽ quy hoạch hành lang phân tách luồng người (Personnel Flow)
          và luồng hàng (Material Flow) độc lập ngay từ bước Thiết kế ý tưởng (Concept Design) để đáp ứng tiêu chuẩn GMP/ISO quốc tế.
        deliverable_formats:
          - checked: true
            label: "Danh mục phòng ban chức năng"
        client_feedback:
          - checked: false
            text: "Cần tích hợp khu văn phòng quản lý trên tầng 2"
          - checked: true
            text: "Kho nguyên liệu cần cửa xuất nhập độc lập"

      - ref_code: "2.3"
        title_vi: "Chiều cao Thông thủy & Tải trọng Sàn"
        title_en: "Clear Heights & Floor Loadings"
        request_details:
          - "Chiều cao thông thủy trần yêu cầu để lắp đặt dây chuyền/máy móc (đáy dầm đến mặt sàn) (m)."
          - "Chiều cao xếp hàng hóa trong kho hàng và tải trọng sàn thiết kế (Tấn/m2)."
        consultant_recommendation: >
          Đề xuất của Tư vấn: Trần xưởng sạch khuyến nghị 4.5m - 5.0m; kho hàng khuyến nghị 7.5m - 9.0m.
          Tải trọng sàn khu vực máy SMT đề xuất thiết kế 2.0 - 2.5 Tấn/m2.
        deliverable_formats:
          - checked: true
            label: "Bản kê thông số máy móc"
        client_feedback:
          - checked: false
            text: "Chiều cao trần sạch mong muốn: 4.5m"
          - checked: true
            text: "Tải trọng sàn xưởng chính: 2.0 Tấn/m2"

  - section_id: "III"
    section_title_vi: "ĐẶC THÙ CÔNG NGHỆ, PHÒNG SẠCH & TIỆN ÍCH PHỤ TRỢ"
    section_title_en: "PROCESS CHARACTERISTICS, CLEANROOM & UTILITIES"
    items:
      - ref_code: "3.1"
        title_vi: "Yêu cầu Phòng sạch & Kiểm soát Môi trường"
        title_en: "Cleanroom & Environmental Specifications"
        request_details:
          - "Cấp sạch yêu cầu (ISO Class 6, 7 hay 8 / Class 1.000, 10.000, 100.000)?"
          - "Yêu cầu kiểm soát nhiệt độ (độ C) và độ ẩm tương đối (% RH)?"
          - "Yêu cầu chống tĩnh điện cho sàn (ESD)?"
        consultant_recommendation: >
          Đề xuất của Tư vấn: Ứng dụng hệ thống điều hòa chính xác AHU tích hợp lọc HEPA và buồng đệm Air Shower,
          sử dụng sàn Epoxy dẫn điện / phân tán tĩnh điện ESD đạt tiêu chuẩn IEC 61340.
        deliverable_formats:
          - checked: true
            label: "Bảng thông số môi trường xưởng"
        client_feedback:
          - checked: false
            text: "Phòng sạch yêu cầu: ISO Class 7 (Class 10.000)"
          - checked: true
            text: "Nhiệt độ 22 +/- 2 độ C, Độ ẩm 50 +/- 5% RH"

      - ref_code: "3.2"
        title_vi: "Hóa chất Sử dụng & Phân hạng Nguy hiểm Cháy"
        title_en: "Chemicals Used & Fire Hazard Classification"
        request_details:
          - "Trong quy trình có sử dụng cồn công nghiệp (IPA), dung môi hữu cơ, keo dán tẩy rửa không?"
          - "Khối lượng lưu trữ hóa chất tối đa tại khu vực sản xuất và kho chứa?"
        consultant_recommendation: >
          Đề xuất của Tư vấn: Chuyên gia IBST sẽ chịu trách nhiệm tính toán xác định Hạng nguy hiểm cháy C hoặc D
          theo Phụ lục C QCVN 06:2022/BXD. Nếu có dung môi IPA, Chuyên gia IBST sẽ bố trí phòng pha chế chuyên dụng
          có tường ngăn cháy loại 1 và hệ thống hút khí xả phòng nổ để bảo vệ toàn bộ nhà máy không bị phân loại Hạng A/B.
        deliverable_formats:
          - checked: true
            label: "Bảng dữ liệu an toàn hóa chất (MSDS)"
        client_feedback:
          - checked: false
            text: "Có dùng cồn IPA vệ sinh bản mạch (số lượng nhỏ)"
          - checked: true
            text: "Nhờ chuyên gia IBST tính toán giải pháp ngăn cháy kho IPA"

