# ==============================================================================
# CCBA Personal Profile Template (Canonical Schema)
# ==============================================================================
# Sổ tay thực thể cá nhân chuẩn hóa dùng cho các thủ tục hành chính,
# hồ sơ xin thị thực (Visa), trích lục lý lịch, hợp đồng và biểu mẫu văn phòng.
#
# LƯU Ý BẢO MẬT PII:
# - KHÔNG commit file chứa thông tin thực tế vào git repository công khai.
# - Lưu trữ file thực tế theo cơ chế nạp tăng tiến (Cascading Vault Resolver):
#   1. Cục bộ Spoke: ./.md/knowledge/personal_profile.yaml (ghi đè theo dự án)
#   2. Central User Vault: ~/.ccba/personal_profile.yaml (hoặc $CCBA_PERSONAL_VAULT)
# ==============================================================================

